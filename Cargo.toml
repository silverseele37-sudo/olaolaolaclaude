[package]
name = "forge"
description = "Fachada de FORGE y guardia de la arquitectura."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
forge-math = { workspace = true }
forge-store = { workspace = true }
forge-doc = { workspace = true }
forge-io = { workspace = true }

[dev-dependencies]
toml = "0.9"
forge-kernel-api = { workspace = true }
forge-kernel-stub = { workspace = true }
forge-mesh = { workspace = true }
forge-interop = { workspace = true }
forge-assets = { workspace = true }

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
forge-math  = { path = "crates/forge-math" }
forge-store = { path = "crates/forge-store" }
forge-doc   = { path = "crates/forge-doc" }
forge-io    = { path = "crates/forge-io" }
forge-kernel-api   = { path = "crates/forge-kernel-api" }
forge-render-api   = { path = "crates/forge-render-api" }
forge-material-api = { path = "crates/forge-material-api" }
forge-interop      = { path = "crates/forge-interop" }
forge-kernel-stub  = { path = "crates/forge-kernel-stub" }
forge-mesh         = { path = "crates/forge-mesh" }
forge-param        = { path = "crates/forge-param" }
forge-assets       = { path = "crates/forge-assets" }
forge-script       = { path = "crates/forge-script" }
forge-escena       = { path = "crates/forge-escena" }
forge-render-cpu   = { path = "crates/forge-render-cpu" }
forge-material     = { path = "crates/forge-material" }
forge-runtime      = { path = "crates/forge-runtime" }

glam      = { version = "0.30", features = ["serde"] }
blake3    = "1"
serde     = { version = "1", features = ["derive"] }
ciborium  = "0.2"
thiserror = "2"
ulid      = { version = "1", features = ["serde"] }
rpds      = "1"
zip       = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
wgpu       = "30"
winit      = "0.30"
egui       = "0.32"
egui-wgpu  = "0.32"
egui-winit = "0.32"
png        = "0.18"
bytemuck   = "1"
pollster   = "0.4"

[profile.release]
debug = 1
