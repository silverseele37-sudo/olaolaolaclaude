[package]
name = "forge"
description = "Fachada de FORGE y guardia de la arquitectura."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
forge-math = { workspace = true }
forge-store = { workspace = true }
forge-doc = { workspace = true }
forge-io = { workspace = true }

[dev-dependencies]
toml = "0.9"

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
forge-math  = { path = "crates/forge-math" }
forge-store = { path = "crates/forge-store" }
forge-doc   = { path = "crates/forge-doc" }
forge-io    = { path = "crates/forge-io" }
forge-kernel-api   = { path = "crates/forge-kernel-api" }
forge-render-api   = { path = "crates/forge-render-api" }
forge-material-api = { path = "crates/forge-material-api" }
forge-interop      = { path = "crates/forge-interop" }

glam      = { version = "0.30", features = ["serde"] }
blake3    = "1"
serde     = { version = "1", features = ["derive"] }
ciborium  = "0.2"
thiserror = "2"
ulid      = { version = "1", features = ["serde"] }
rpds      = "1"
zip       = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"

[profile.release]
debug = 1
